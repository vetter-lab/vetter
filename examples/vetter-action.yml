name: Vetter review

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  actions: read
  contents: write
  pull-requests: write
  checks: write

concurrency:
  group: vetter-${{ github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: vetter-lab/vetter@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          model-api-key: ${{ secrets.VETTER_MODEL_API_KEY }}
          config: |
            version: 1
            review:
              enabled: true
              incremental: true
              model: gpt-5.6-luna
              baseUrl: https://api.openai.com/v1
              language: en
              maxDiffBytes: 200000
            events:
              push:
                enabled: true
                requireOpenPullRequest: true
                branchPatterns:
                  - "**"
            severity:
              P0: { blockMerge: false }
              P1: { blockMerge: false }
              P2: { blockMerge: false }
              P3: { blockMerge: false }
            limits:
              modelRetries: 2
