name: "Vetter code review"
description: "Reviews open pull requests with an LLM. Pushes with no matching open pull request are skipped."
author: "vetter"

inputs:
  github-token:
    description: "Token used to read the diff and write review comments, threads, and the Check Run. Usually secrets.GITHUB_TOKEN."
    required: true
  model-api-key:
    description: "API key for the OpenAI-compatible review model."
    required: true
  model:
    description: "Model name; overrides review.model in config."
    required: false
  base-url:
    description: "OpenAI-compatible model endpoint; overrides review.baseUrl in config."
    required: false
  baseUrl:
    description: "Alias for base-url."
    required: false
  model-base-url:
    description: "Legacy alias for base-url."
    required: false
  model-name:
    description: "Legacy alias for model."
    required: false
  config:
    description: "Optional YAML configuration merged above the repository config file."
    required: false
  config-path:
    description: "Path to the repository's Vetter configuration file."
    required: false
    default: ".vetter.yml"

runs:
  using: "node20"
  main: "dist/action/index.js"

branding:
  icon: "check-circle"
  color: "purple"
